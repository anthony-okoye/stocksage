services:
  api-gateway:
    build:
      context: .
      dockerfile: ./api-gateway/Dockerfile
    ports:
      - "8100:8100"
    environment:
      - PYTHONUNBUFFERED=1
      - API_GATEWAY_PORT=8100
      - API_GATEWAY_AGENT_SEED=${API_GATEWAY_AGENT_SEED}
      - QUERY_PLANNER_AGENT_ADDRESS=${QUERY_PLANNER_AGENT_ADDRESS}
      - GROQ_API_KEY=${GROQ_API_KEY}
    networks:
      - stocksage_net

  query-planner-agent:
    build:
      context: .
      dockerfile: ./agents/query_planner_agent/Dockerfile
    environment:
      - PYTHONUNBUFFERED=1
      - QUERY_PLANNER_AGENT_SEED=${QUERY_PLANNER_AGENT_SEED}
      - GROQ_API_KEY=${GROQ_API_KEY}
    networks:
      - stocksage_net
    depends_on:
      - api-gateway

  fundamentals-agent:
    build:
      context: .
      dockerfile: ./agents/fundamentals_agent/Dockerfile
    environment:
      - PYTHONUNBUFFERED=1
      - FUNDAMENTALS_AGENT_SEED=${FUNDAMENTALS_AGENT_SEED}
      - API_GATEWAY_AGENT_ADDRESS=${API_GATEWAY_AGENT_ADDRESS}
      - GROQ_API_KEY=${GROQ_API_KEY}
    networks:
      - stocksage_net
    depends_on:
      - api-gateway
      - query-planner-agent

networks:
  stocksage_net:
    driver: bridge 